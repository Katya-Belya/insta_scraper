<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flyer Event Extractor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1 class="app-title">Flyer Event Extractor</h1>

  <!-- Choose -> Review -> Calendar. popup.css highlights the current step
       from the review state, so this needs no JavaScript. -->
  <ol class="steps" aria-label="Steps">
    <li class="step step-choose"><span class="step-num">1</span>Choose</li>
    <li class="step step-review"><span class="step-num">2</span>Review</li>
    <li class="step step-calendar"><span class="step-num">3</span>Calendar</li>
  </ol>

  <!-- Step 1: choose one flyer. The input is visually replaced by its label,
       so the user sees a button rather than a bare file field. -->
  <input id="file-input" type="file" accept="image/png,image/jpeg,image/webp">
  <label id="select-flyer" class="select-flyer" for="file-input">
    Select Flyer
  </label>

  <p class="file-row">
    Flyer: <span id="filename"></span>
  </p>

  <!-- Idle, processing, success, no date found, invalid file, or connection
       error: whichever state the flyer is in right now. -->
  <p id="state-message" role="status" aria-live="polite"></p>

  <!-- Step 2: review what the pipeline read. Hidden until there is a result.
       popup.js adds review-pending / review-accepted / review-edited and
       is-uncertain to this element's classes. -->
  <section id="result" class="result" hidden aria-label="Review the event date">
    <div class="date-header">
      <span class="date-label">Event date</span>
      <span id="review-status"></span>
    </div>

    <p class="event-date-row">
      <span id="event-date"></span>
      <!-- Shown instead of the span while the date is being edited -->
      <input id="event-date-input" type="text" hidden
             placeholder="YYYY-MM-DD" aria-label="Event date (YYYY-MM-DD)">
    </p>

    <!-- Only shown once the reviewed date differs from the one OCR read -->
    <p id="original-event-date-row" class="original-date" hidden>
      Flyer read: <span id="original-event-date"></span>
    </p>

    <!-- Only shown for a result this popup has a pipeline status for.
         Warning statuses (past date, distant year) get the is-warning class. -->
    <p id="status-row">
      <!-- "Original extraction warning" once the date has been corrected -->
      <span id="status-label"></span>
      <span id="status"></span>
    </p>

    <p class="needs-review-row">
      Needs review: <span id="needs-review"></span>
    </p>

    <!-- Buttons the user reviews a FlyerResult with -->
    <div class="review-actions">
      <button id="accept" class="btn-primary">Accept date</button>
      <button id="edit">Edit date</button>
      <!-- Only shown while the date is being edited -->
      <button id="save" class="btn-primary" hidden>Save date</button>
    </div>

    <!-- Step 3: calendar. Both buttons stay disabled until the date is
         accepted or saved, and while it is being edited. -->
    <div class="export-section">
      <button id="add-to-google-calendar" class="btn-primary" disabled>Add to Google Calendar</button>
      <button id="export" disabled>Download .ics file</button>
      <p class="export-hint hint-locked">Accept or save the date to add it to your calendar.</p>
      <p class="export-hint hint-ready">Uses the reviewed date shown above.</p>

      <!-- JavaScript writes review feedback here after a button is clicked -->
      <p id="message" role="status" aria-live="polite"></p>
    </div>
  </section>

  <div class="footer">
    <button id="clear-results" type="button" disabled>Clear results</button>
  </div>

  <!-- Load the popup behavior.
       latest_result.js is written by a command-line pipeline run and may not
       exist; the popup works without it. -->
  <script src="latest_result.js"></script>
  <script src="ics.js"></script>
  <script src="popup.js"></script>
</body>
</html>
