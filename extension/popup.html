<head>
  <meta charset="UTF-8">
  <title>Flyer Event Extractor</title>

  <style>
    body {
      width: 260px;
      padding: 12px;
      font-family: Arial, sans-serif;
    }

    h2 {
      margin-top: 0;
    }

    p {
      margin: 10px 0;
    }

    button {
      margin-right: 6px;
    }

    #event-date-input {
      width: 110px;
    }

    /* The real file input is replaced by its label, which can be styled like
       a button. Hiding it with a class rather than the hidden attribute keeps
       it focusable from the keyboard. */
    #file-input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }

    .select-flyer {
      display: block;
      padding: 8px;
      border: 1px solid #767676;
      border-radius: 4px;
      background: #f4f4f4;
      text-align: center;
      cursor: pointer;
    }

    .select-flyer:hover {
      background: #e8e8e8;
    }

    #file-input:focus + .select-flyer {
      outline: 2px solid #1a73e8;
    }

    /* One line describing where the flyer is in the extraction, coloured by
       how the extraction went. */
    #state-message {
      min-height: 1em;
      color: #444;
    }

    #state-message.is-working {
      color: #1a73e8;
    }

    #state-message.is-success {
      color: #137333;
    }

    #state-message.is-error {
      color: #c5221f;
    }

    .result {
      border-top: 1px solid #ddd;
      margin-top: 12px;
      padding-top: 4px;
    }

    /* Temporary: the native messaging ping test (POC milestone 1). Delete
       this block together with the ping markup and native_ping.js. */
    .native-ping {
      border-top: 1px solid #ddd;
      margin-top: 12px;
      padding-top: 8px;
    }

    #ping-native-host-result {
      min-height: 1em;
      color: #444;
      word-break: break-word;
    }

    #ping-native-host-result.is-working {
      color: #1a73e8;
    }

    #ping-native-host-result.is-success {
      color: #137333;
    }

    #ping-native-host-result.is-error {
      color: #c5221f;
    }
  </style>
</head>

  <!-- Step 1: choose one flyer. The input is visually replaced by its label,
       so the user sees a button rather than a bare file field. -->
  <input id="file-input" type="file" accept="image/png,image/jpeg,image/webp">
  <label id="select-flyer" class="select-flyer" for="file-input">
    Select Flyer
  </label>

  <p>
    <strong>File:</strong>
    <span id="filename"></span>
  </p>

  <!-- Idle, processing, success, no date found, invalid file, or connection
       error: whichever state the flyer is in right now. -->
  <p id="state-message"></p>

  <!-- Step 2: review what the pipeline read. Hidden until there is a result. -->
  <div id="result" class="result" hidden>
    <p>
      <strong>Event date:</strong>
      <span id="event-date"></span>
      <!-- Shown instead of the span while the date is being edited -->
      <input id="event-date-input" type="text" hidden>
    </p>

    <!-- Only shown once the reviewed date differs from the one OCR read -->
    <p id="original-event-date-row" hidden>
      <strong>Original date:</strong>
      <span id="original-event-date"></span>
    </p>

    <!-- Only shown for a result this popup has a pipeline status for -->
    <p id="status-row">
      <strong>Status:</strong>
      <span id="status"></span>
    </p>

    <p>
      <strong>Needs review:</strong>
      <span id="needs-review"></span>
    </p>

    <p>
      <strong>Review status:</strong>
      <span id="review-status"></span>
    </p>

    <!-- Buttons the user reviews a FlyerResult with -->
    <button id="accept">Accept</button>
    <button id="edit">Edit</button>
    <!-- Only shown while the date is being edited -->
    <button id="save" hidden>Save</button>
    <button id="export">Export to Calendar</button>

    <!-- JavaScript writes review feedback here after a button is clicked -->
    <p id="message"></p>
  </div>

  <!-- Temporary: native messaging ping test (POC milestone 1).
       Sends {"action": "ping"} straight to the Python host Chrome starts
       itself, with no `python -m src.server` running. Not part of the review
       workflow above; delete this block, native_ping.js and its styles once
       the real transport replaces it. -->
  <div class="native-ping">
    <button id="ping-native-host">Ping Native Host</button>
    <p id="ping-native-host-result"></p>
  </div>

  <!-- Load the popup behavior.
       latest_result.js is written by a command-line pipeline run and may not
       exist; the popup works without it. -->
<script src="latest_result.js"></script>
<script src="ics.js"></script>
<!-- Temporary: the ping test's own script, kept out of popup.js. -->
<script src="native_ping.js"></script>
<script src="popup.js"></script>
</body>
